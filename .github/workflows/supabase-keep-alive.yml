# Supabase pauses Free-plan projects that see too little database activity over a rolling
# 7-day window. This workflow reads from the database through the backend twice a day so
# the project never goes idle. See documents/FEAT-16 for the research behind the schedule.
name: Supabase keep-alive

on:
  schedule:
    # 03:17 and 15:17 UTC. Off the top of the hour, where GitHub delays scheduled runs most.
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

env:
  BACKEND_URL: https://papa-bread-api.vercel.app

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the backend
        # Retries absorb serverless cold starts. A failed run makes GitHub email the
        # person who last changed the cron line, which doubles as a "DB is down" alert.
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            "${BACKEND_URL}/api/health/db"
